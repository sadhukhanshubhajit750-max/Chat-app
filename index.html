<!DOCTYPE html>
<html>
<head>
  <title>Chat App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- ===================== -->
<!-- AUTH SCREEN (Login/SignUp) -->
<!-- ===================== -->
<div id="auth-screen" class="center">
  <div class="join-card">
    <h2 id="auth-title">Login to Chat</h2>
    <input id="auth-email" type="email" placeholder="Email Address" autocomplete="off">
    <input id="auth-password" type="password" placeholder="Password" autocomplete="off">
    <input id="auth-confirm-password" type="password" placeholder="Confirm Password" autocomplete="off" style="display: none;">
    <input id="auth-name" type="text" placeholder="Your Full Name" autocomplete="off" style="display: none;">
    <div class="show-password-container">
      <input type="checkbox" id="show-password" onclick="togglePasswordVisibility()">
      <label for="show-password">Show Password</label>
    </div>
    <button class="join-btn" id="auth-btn" onclick="handleAuth()">Login</button>
    <p id="auth-toggle" onclick="toggleAuthMode()" class="toggle-text">Don't have an account? Sign Up</p>
  </div>
</div>


<!-- ===================== -->
<!-- JOIN SCREEN -->
<!-- ===================== -->
<div id="join" style="display:none;">
  <!-- Top Header -->
  <header id="main-header" class="main-header">
    <h2 class="header-title">My Chat App</h2>
    <div class="header-actions">
      <button class="icon-btn" title="Create Room" onclick="openModal('create-modal')">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="btn-text" onclick="openModal('join-modal')">Join</button>
      <button class="icon-btn" title="Toggle Theme" onclick="toggleTheme()">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
      </button>
      <button class="leave-btn" onclick="logout()" style="margin-left: 10px;">Logout</button>
    </div>
  </header>

  <input type="hidden" id="name">

  <!-- Dashboard Main Content -->
  <div class="dashboard-content">
    <div class="rooms-card main-rooms-card">
      <div id="room-list" class="room-list">
        <!-- Rooms will be loaded here -->
      </div>
    </div>
  </div>

  <!-- Create Room Modal -->
  <div id="create-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('create-modal')">&times;</span>
      <h3>Create a Room</h3>
      <input id="create-room" placeholder="New Room Code" autocomplete="off">
      <input id="create-password" type="password" placeholder="Set Password" autocomplete="off">
      <div class="show-password-container">
        <input type="checkbox" id="show-create-password" onclick="toggleCreatePasswordVisibility()">
        <label for="show-create-password">Show Password</label>
      </div>
      <input id="create-max" type="number" placeholder="Max Limit (e.g. 5)" min="2" autocomplete="off">
      <button class="join-btn" onclick="createRoom()">Create Room</button>
    </div>
  </div>

  <!-- Join Room Modal -->
  <div id="join-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('join-modal')">&times;</span>
      <h3>Join a Room</h3>
      <input id="join-room" placeholder="Existing Room Code" autocomplete="off">
      <input id="join-password" type="password" placeholder="Room Password" autocomplete="off">
      <div class="show-password-container">
        <input type="checkbox" id="show-join-password" onclick="toggleJoinPasswordVisibility()">
        <label for="show-join-password">Show Password</label>
      </div>
      <button class="join-btn" onclick="joinRoom()">Join Room</button>
    </div>
  </div>
</div>


<!-- ===================== -->
<!-- CHAT SCREEN -->
<!-- ===================== -->
<div id="chat" class="chat-container" style="display:none;">
  <div class="chat">
    <div class="top-bar">
      <div>
        <span id="roomTitle"></span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <button class="leave-btn" onclick="leave()">Leave</button>
      </div>
    </div>

    <div class="chat-content">
      <!-- Left Side (Messages) -->
      <div class="chat-main">
        <div id="messages" class="messages"></div>

        <!-- typing indicator -->
        <div id="typing" style="display:none;"></div>

        <!-- reply preview bar -->
        <div id="reply-preview" class="reply-preview" style="display:none;">
          <div class="reply-preview-content">
            <span id="reply-preview-name" style="font-weight:bold; color: #00a884; font-size: 13px;"></span>
            <p id="reply-preview-text" style="margin: 3px 0 0; font-size: 13px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px;"></p>
          </div>
          <span class="close-reply" onclick="cancelReply()">×</span>
        </div>

        <!-- input bar -->
        <div class="input-bar">
          <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="uploadImage(event)">
          <div id="upload-progress" class="upload-progress" style="display: none;">
            <svg width="44" height="44">
              <circle class="bg" cx="22" cy="22" r="18"></circle>
              <circle class="bar" id="progress-ring-bar" cx="22" cy="22" r="18"></circle>
            </svg>
            <span id="upload-percent">0%</span>
          </div>
          <button id="attach-btn" class="attach-btn" onclick="document.getElementById('imageInput').click()" title="Send Image">
            <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <input id="msg" placeholder="Type a message..." autocomplete="off">
          <button class="send-btn" onclick="send()">
            <svg viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- WhatsApp Style Message Options -->
<div id="msg-options-overlay" class="msg-options-overlay" style="display:none;" onclick="closeMessageOptions()"></div>
<div id="msg-options-menu" class="msg-options-menu" style="display:none;">
  <div class="msg-options-content">
    <button id="edit-msg-btn" class="msg-opt-btn" onclick="editMessage()">Edit message</button>
    <button class="msg-opt-btn delete" onclick="unsendMessage()">Delete for everyone</button>
  </div>
</div>


<!-- ===================== -->
<!-- FIREBASE -->
<!-- ===================== -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<!-- YOUR SCRIPT -->
<script src="app.js"></script>

</body>
</html>
